
! ============================================================
! ISP-R1 — Internet simulation
! ============================================================
hostname ISP-R1
no ip domain-lookup

interface GigabitEthernet0/0
 description TO-EDGE
 ip address 200.1.1.1 255.255.255.252
 no shutdown

interface Loopback0
 description INTERNET-TEST-TARGET
 ip address 8.8.8.8 255.255.255.255

! Route to published NAT block (not required, same subnet) and inside/dmz via EDGE (optional for tests)
ip route 10.10.10.0 255.255.255.0 200.1.1.2
ip route 10.10.50.0 255.255.255.0 200.1.1.2

line con 0
 logging synchronous
 exec-timeout 0 0
end
