
! ============================================================
! EDGE-R1 — INSIDE/DMZ/OUTSIDE with Zone-Based Firewall + NAT
! ============================================================
hostname EDGE-R1
no ip domain-lookup

! -------------------- Interfaces --------------------
interface GigabitEthernet0/0
 description OUTSIDE-to-ISP
 ip address 200.1.1.2 255.255.255.252
 ip nat outside
 zone-member security OUTSIDE
 no shutdown

interface GigabitEthernet0/1
 description INSIDE-to-LAN
 ip address 10.10.10.1 255.255.255.0
 ip nat inside
 zone-member security INSIDE
 no shutdown

interface GigabitEthernet0/2
 description DMZ-to-SERVERS
 ip address 10.10.50.1 255.255.255.0
 ip nat inside
 zone-member security DMZ
 no shutdown

! -------------------- Routing --------------------
ip route 0.0.0.0 0.0.0.0 200.1.1.1
ip route 8.8.8.8 255.255.255.255 200.1.1.1

! -------------------- NAT --------------------
! Static NAT for DMZ servers (publishing)
ip nat inside source static 10.10.50.50 200.1.1.50
ip nat inside source static 10.10.50.51 200.1.1.51

! PAT for inside users to internet
ip access-list extended NAT-INSIDE
 permit ip 10.10.10.0 0.0.0.255 any
exit
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/0 overload

! -------------------- ZBF: Define zones --------------------
zone security INSIDE
zone security DMZ
zone security OUTSIDE

! -------------------- Class-maps (match traffic) --------------------
! OUTSIDE -> DMZ public services only (to public NAT IPs)
ip access-list extended OUTSIDE_TO_DMZ_ALLOWED
 permit tcp any host 200.1.1.50 eq 80
 permit tcp any host 200.1.1.50 eq 443
 permit udp any host 200.1.1.51 eq 53
 permit tcp any host 200.1.1.51 eq 53
exit

class-map type inspect match-any CM-OUTSIDE-DMZ
 match access-group name OUTSIDE_TO_DMZ_ALLOWED

! INSIDE -> OUTSIDE allow all
class-map type inspect match-any CM-INSIDE-OUT
 match protocol ip

! INSIDE -> DMZ allow all (common enterprise pattern)
class-map type inspect match-any CM-INSIDE-DMZ
 match protocol ip

! -------------------- Policy-maps --------------------
policy-map type inspect PM-OUTSIDE-DMZ
 class type inspect CM-OUTSIDE-DMZ
  inspect
 class class-default
  drop

policy-map type inspect PM-INSIDE-OUT
 class type inspect CM-INSIDE-OUT
  inspect
 class class-default
  drop

policy-map type inspect PM-INSIDE-DMZ
 class type inspect CM-INSIDE-DMZ
  inspect
 class class-default
  drop

! DMZ -> INSIDE should be blocked
policy-map type inspect PM-DMZ-INSIDE
 class class-default
  drop

! OUTSIDE -> INSIDE should be blocked
policy-map type inspect PM-OUTSIDE-INSIDE
 class class-default
  drop

! -------------------- Zone-pairs --------------------
zone-pair security ZP-OUTSIDE-DMZ source OUTSIDE destination DMZ
 service-policy type inspect PM-OUTSIDE-DMZ

zone-pair security ZP-OUTSIDE-INSIDE source OUTSIDE destination INSIDE
 service-policy type inspect PM-OUTSIDE-INSIDE

zone-pair security ZP-INSIDE-OUTSIDE source INSIDE destination OUTSIDE
 service-policy type inspect PM-INSIDE-OUT

zone-pair security ZP-INSIDE-DMZ source INSIDE destination DMZ
 service-policy type inspect PM-INSIDE-DMZ

zone-pair security ZP-DMZ-INSIDE source DMZ destination INSIDE
 service-policy type inspect PM-DMZ-INSIDE

! -------------------- Management --------------------
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 transport input ssh
 login
end
